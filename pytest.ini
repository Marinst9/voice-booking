[pytest]
testpaths = tests
pythonpath = .
markers =
    postgres: needs a PostgreSQL database (set TEST_DATABASE_URL); skip with -m "not postgres"
# Harmless warning from the test library itself, not from our code.
filterwarnings =
    ignore::DeprecationWarning:fastapi.testclient
    ignore:Using `httpx` with `starlette.testclient`
