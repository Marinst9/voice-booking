# Render Blueprint: the free deployment (Render free web service + Neon database).
# Render reads this file when you create the service with "New -> Blueprint" (see README
# "Free deployment: Render + Neon"). Spec: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: voice-booking
    runtime: docker
    plan: free
    # Frankfurt: put the Neon database in the same region (AWS Europe Central, Frankfurt),
    # because every tool call makes a few database queries.
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    # Deploy a push to main only after the GitHub Actions workflow (lint, tests, image smoke test) passed.
    autoDeployTrigger: checksPass
    # No dockerCommand: the Dockerfile's CMD starts the app (on $PORT, set by Render). Render passes a
    # dockerCommand to the shell with its quotes still on, so `sh -c "a && b"` fails with "not found".
    # /health/live never touches the database, so Render's health checks (every few seconds)
    # don't keep Neon awake and use up its free compute hours.
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CALENDAR_BACKEND
        value: postgres
      # Free services have no pre-deploy command, so the Dockerfile's CMD runs the migrations before the app.
      # They're quick when there's nothing to do, and if one fails the app doesn't start, so the deploy
      # fails its health check and Render keeps the previous version running.
      - key: RUN_MIGRATIONS
        value: "true"
      # Render sits behind Cloudflare, which always sets this header to the real caller IP
      # (and rejects requests that try to fake it). Used by the rate limits.
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
      - key: ADMIN_USERNAME
        value: admin
      # Render makes random values for these the first time (read them under Environment in the dashboard).
      - key: API_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      # You paste these when creating the Blueprint (sync: false = secret, not stored in this file).
      - key: DATABASE_URL # the Neon connection string
        sync: false
      - key: VAPI_SECRET # the same value as in your Vapi Bearer Token credential
        sync: false
