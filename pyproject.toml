# Project tool settings (ruff = linter/formatter, pytest = tests).

[project]
name = "voice-booking"
version = "0.1.0"
description = "Backend for an AI voice booking assistant for a barber shop"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # style errors (pycodestyle)
    "W",   # style warnings
    "F",   # real mistakes: unused imports, undefined names... (pyflakes)
    "I",   # import order (isort)
    "B",   # likely bugs (flake8-bugbear)
    "UP",  # use modern Python syntax (pyupgrade)
    "SIM", # simpler ways to write the same thing
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)` in default arguments is the intended pattern, not a bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "postgres: needs a PostgreSQL database (set TEST_DATABASE_URL); skip with -m \"not postgres\"",
]
filterwarnings = [
    # Harmless warning from the test library itself, not from our code.
    "ignore::DeprecationWarning:fastapi.testclient",
    "ignore:Using `httpx` with `starlette.testclient`",
]
