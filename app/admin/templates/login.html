{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card" style="max-width: 380px; margin: 40px auto;">
  <h1>Log in</h1>
  {% if not login_enabled %}
    <p class="error">The admin login is turned off. Set <code>ADMIN_PASSWORD</code> in <code>.env</code> and restart the server.</p>
  {% else %}
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/admin/login">
      <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required
             value="{{ username or '' }}" autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p><button class="primary" type="submit">Log in</button></p>
    </form>
  {% endif %}
</div>
{% endblock %}
