<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Admin{% endblock %} · Barber shop</title>
  <style>
    /* One small stylesheet for every admin page. Colors are variables, so dark mode only swaps them. */
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1d2430; --muted: #667085; --line: #e4e7ec;
      --accent: #2f5bd3; --accent-soft: #e8eefc; --good: #137a3e; --good-soft: #e3f4ea;
      --bad: #b42318; --bad-soft: #fdecea; --radius: 10px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418; --card: #1a1f26; --text: #e6e9ee; --muted: #9aa4b2; --line: #2b323c;
        --accent: #7c9cff; --accent-soft: #232c45; --good: #5fd08f; --good-soft: #17301f;
        --bad: #ff8a80; --bad-soft: #3a1d1b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    a { color: var(--accent); }
    header {
      background: var(--card); border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 1;
    }
    .bar {
      max-width: 1000px; margin: 0 auto; padding: 10px 16px;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .brand { font-weight: 700; text-decoration: none; color: var(--text); margin-right: auto; }
    nav a { text-decoration: none; color: var(--muted); padding: 6px 10px; border-radius: 8px; }
    nav a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
    main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    h2 { font-size: 1.1rem; margin: 28px 0 10px; }
    .muted { color: var(--muted); }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px;
    }
    .flash {
      background: var(--accent-soft); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px;
    }
    .error { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 8px 12px; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
    .stat .value { font-size: 2rem; font-weight: 700; line-height: 1.2; }
    .stat .label { color: var(--muted); font-size: .9rem; }

    /* Tables (they turn into stacked cards on phones, see the bottom) */
    table { width: 100%; border-collapse: collapse; background: var(--card);
            border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    tr:last-child td { border-bottom: 0; }
    .empty { padding: 16px; color: var(--muted); }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .8rem; font-weight: 600; }
    .badge.yes { background: var(--good-soft); color: var(--good); }
    .badge.no { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
    .badge.cancelled { background: var(--bad-soft); color: var(--bad); }

    /* Buttons and forms */
    button, .button {
      font: inherit; cursor: pointer; border-radius: 8px; padding: 6px 12px;
      border: 1px solid var(--line); background: var(--card); color: var(--text); text-decoration: none;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; width: 100%; padding: 10px; }
    button.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
    button.link { border: 0; background: none; color: var(--muted); padding: 6px 10px; }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
    input[type=text], input[type=password] {
      width: 100%; font: inherit; padding: 10px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--bg); color: var(--text);
    }
    form.inline { display: inline; margin: 0; }
    .pager { display: flex; justify-content: space-between; margin-top: 12px; }

    /* Call detail */
    dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
    dl.facts dt { color: var(--muted); }
    dl.facts dd { margin: 0; overflow-wrap: anywhere; }
    .transcript { display: flex; flex-direction: column; gap: 8px; }
    .line { max-width: 85%; padding: 8px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
    .line .who { display: block; font-size: .75rem; font-weight: 700; color: var(--muted); }
    .line.caller { align-self: flex-end; background: var(--accent-soft); border-color: transparent; }
    .summary { white-space: pre-wrap; }

    @media (max-width: 640px) {
      /* Each table row becomes a small card; data-label shows the column name. */
      table, thead, tbody, tr, td { display: block; }
      table { border: 0; background: none; }
      thead { display: none; }
      tr { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; padding: 6px 0; }
      td { border: 0; padding: 4px 12px; display: flex; justify-content: space-between; gap: 12px; }
      td::before { content: attr(data-label); color: var(--muted); font-size: .85rem; }
      td.actions::before { content: none; }
      td.actions { justify-content: flex-end; }
      .line { max-width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="brand" href="/admin">Barber shop admin</a>
      {% if admin %}
      <nav>
        <a href="/admin" {% if active == "bookings" %}aria-current="page"{% endif %}>Bookings</a>
        <a href="/admin/calls" {% if active == "calls" %}aria-current="page"{% endif %}>Calls</a>
      </nav>
      <form class="inline" method="post" action="/admin/logout">
        <input type="hidden" name="csrf" value="{{ csrf_token(request) }}">
        <button class="link" type="submit">Log out</button>
      </form>
      {% endif %}
    </div>
  </header>
  <main>
    {% if flash %}<div class="flash" role="status">{{ flash }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
